apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysite
  namespace: mysite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysite
  template:
    metadata:
      labels:
        app: mysite
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname # CHANGED: Uses standard node hostname topology
          whenUnsatisfiable: ScheduleAnyway   # CHANGED: Allows scheduling on single nodes/local setups
          labelSelector:
            matchLabels:
              app: mysite
      containers:
        - name: mysite
          image: aashishsharma5555/mysite:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20

